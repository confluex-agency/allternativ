name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Typecheck covers the app AND scripts/ + prisma/seed.ts, which the build
      # does not look at (see "Commands" in CLAUDE.md).
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholders. The build never connects: storefront pages are not
          # pre-rendered (CLAUDE.md, "Storefront pages are never pre-rendered").
          DATABASE_URL: "mysql://placeholder:placeholder@localhost:3306/placeholder"
          JWT_SECRET: "ci-test-secret-not-real-at-least-32-characters"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
          # ⚠️ https and not localhost: env.ts refuses a loopback or plain-http
          # address in a production build, on purpose (it is where Stripe sends
          # a shopper after charging them). `.invalid` is reserved and never
          # resolves, so nothing can ever be sent there.
          NEXT_PUBLIC_APP_URL: "https://ci.allternativ.invalid"

      # Defense in depth: also run a quick secret grep on the diff so PRs
      # cannot land an .env or hardcoded key even if gitleaks job is skipped
      - name: Quick secret grep (diff only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          if echo "$DIFF" | grep -iE "(api[_-]?key|secret|password|bearer)\s*[:=]\s*['\"][^'\"]{16,}" ; then
            echo "Possible secret in diff. Review the matches above."
            exit 1
          fi
