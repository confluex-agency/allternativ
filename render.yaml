services:
  - type: web
    name: allternativ-web
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: cron
    name: allternativ-aggregate
    runtime: node
    schedule: "0 2 * * *"
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx scripts/aggregate-analytics.ts
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: cron
    name: allternativ-cleanup
    runtime: node
    schedule: "0 3 * * 0"
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx scripts/cleanup-old-events.ts
    envVars:
      - key: DATABASE_URL
        sync: false
